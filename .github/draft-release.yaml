name: draft-release
on:
    push:
        branches:
            - main
jobs:
    update_release_draft:
        runs-on: ubuntu-latest
        steps:
            - uses: release-drafter/release-drafter@v5
              with:
                  config-name: release-drafter-config.yaml
              env:
                  GITHUB_TOKEN: ${{ secrets.HUB_TOKEN }}
