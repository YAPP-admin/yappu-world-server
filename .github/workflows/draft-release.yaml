name: draft-release
on:
    push:
        branches:
            - prod
jobs:
    update_release_draft:
        runs-on: ubuntu-latest
        steps:
            -   name: Update Release
                uses: release-drafter/release-drafter@v5
                with:
                    config-name: release-drafter-config.yaml
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
