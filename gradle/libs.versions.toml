[versions]
kotlin = "2.1.10"
spring-boot = "3.4.1"
spring-dependency-management = "1.1.7"
ktlint-plugin = "12.2.0"
sentry = "5.2.0"
oracle-pki = "23.5.0.24.07"
kotlin-jdsl = "3.5.5"
p6spy = "1.9.0"
ulid-creator = "5.2.3"
mockk = "1.13.14"
kotest = "5.9.1"
kotest-spring = "1.3.0"
kotlin-logging = "7.0.0"
loki-logback = "2.0.1"
swagger = "2.7.0"
jjwt = "0.12.5"
firebase = "9.4.3"
oci-java-sdk = "3.88.0"


[libraries]
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }

spring-context = { module = "org.springframework:spring-context" }
spring-tx = { module = "org.springframework:spring-tx" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-docker-compose = { module = "org.springframework.boot:spring-boot-docker-compose" }


# Database
mysql-connector = { module = "com.mysql:mysql-connector-j" }
oracle-jdbc = { module = "com.oracle.database.jdbc:ojdbc11" }
oracle-pki = { module = "com.oracle.database.security:oraclepki", version.ref = "oracle-pki" }
h2 = { module = "com.h2database:h2" }

spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
kotlin-jdsl-jpql-dsl = { module = "com.linecorp.kotlin-jdsl:jpql-dsl", version.ref = "kotlin-jdsl" }
kotlin-jdsl-jpql-render = { module = "com.linecorp.kotlin-jdsl:jpql-render", version.ref = "kotlin-jdsl" }
kotlin-jdsl-spring-data-jpa = { module = "com.linecorp.kotlin-jdsl:spring-data-jpa-support", version.ref = "kotlin-jdsl" }
p6spy = { module = "com.github.gavlyukovskiy:p6spy-spring-boot-starter", version.ref = "p6spy" }

# ULID
ulid-creator = { module = "com.github.f4b6a3:ulid-creator", version.ref = "ulid-creator" }

# Test
spring-test = { module = "org.springframework:spring-test" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
kotest-extensions-spring = { module = "io.kotest.extensions:kotest-extensions-spring", version.ref = "kotest-spring" }

# Logging
kotlin-logging = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging" }
loki-logback-appender = { module = "com.github.loki4j:loki-logback-appender", version.ref = "loki-logback" }

# Swagger
springdoc-openapi-webmvc = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "swagger" }

# JWT
jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }

# FCM
firebase = { module = "com.google.firebase:firebase-admin", version.ref = "firebase" }

# OCI
oci-java-sdk-objectstorage = { module = "com.oracle.oci.sdk:oci-java-sdk-objectstorage", version.ref = "oci-java-sdk" }
oci-java-sdk-common-httpclient-jersey3 = { module = "com.oracle.oci.sdk:oci-java-sdk-common-httpclient-jersey3", version.ref = "oci-java-sdk" }

# APM
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
micrometer-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }

# Flyway
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-oracle = { module = "org.flywaydb:flyway-database-oracle" }


[bundles]
db-drivers = ["mysql-connector", "oracle-jdbc", "oracle-pki", "h2"]
kotlin-jdsl = ["kotlin-jdsl-jpql-dsl", "kotlin-jdsl-jpql-render", "kotlin-jdsl-spring-data-jpa"]
kotest = ["kotest-runner-junit5", "kotest-assertions-core", "kotest-property"]
jjwt-runtime = ["jjwt-impl", "jjwt-jackson"]
flyway = ["flyway-core", "flyway-oracle"]


[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-plugin" }
sentry = { id = "io.sentry.jvm.gradle", version.ref = "sentry" }
