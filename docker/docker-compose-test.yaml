services:
    oracle:
        image: gvenzl/oracle-xe:21-slim-faststart
        environment:
            ORACLE_PASSWORD: test1234
            APP_USER: testuser
            APP_USER_PASSWORD: test1234
        ports:
            - '1521:1521'
        healthcheck:
            test: ["CMD-SHELL", "healthcheck.sh"]
            interval: 10s
            timeout: 5s
            retries: 30
            start_period: 60s
